<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <style>
      .bg { fill: #f5f9fc; }
      .header { fill: #0a3661; }
      .navy { fill: #0a3661; }
      .teal { fill: #167e88; }
      .blue { fill: #008ab5; }
      .green { fill: #237e4e; }
      .border { stroke: #b4ced8; stroke-width: 2; fill: #ffffff; }
      .soft { fill: #f8fafc; stroke: #d7e1e6; stroke-width: 2; }
      .soft2 { fill: #f9fcfe; stroke: #bfd3db; stroke-width: 2; }
      .title { font: 700 46px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 22px 'Segoe UI', Arial, sans-serif; fill: #d7e9f5; }
      .h1w { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .h1 { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0a3661; }
      .h2 { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0a3661; }
      .body { font: 18px 'Segoe UI', Arial, sans-serif; fill: #1a2b3a; }
      .small { font: 16px 'Segoe UI', Arial, sans-serif; fill: #1a2b3a; }
      .tiny { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1a2b3a; }
      .muted { font: 16px 'Segoe UI', Arial, sans-serif; fill: #586b78; }
      .mono { font: 16px Consolas, 'Courier New', monospace; fill: #1a2b3a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1320"/>

  <rect class="header" x="20" y="20" width="1760" height="85" rx="16"/>
  <text class="title" x="900" y="60" text-anchor="middle">Databricks Protection Tuning Cheat Sheet</text>
  <text class="subtitle" x="900" y="95" text-anchor="middle">A simpler view of how the benchmark scripts auto-calculate partitions, work units, and CRDP request sizing</text>

  <g transform="translate(30,140)">
    <rect class="border" x="0" y="0" width="560" height="250" rx="20"/>
    <rect class="teal" x="16" y="16" width="528" height="42" rx="14"/>
    <text class="h1w" x="32" y="44">1  Load Size</text>
    <text class="h2" x="28" y="92">Main setting</text>
    <text class="body" x="48" y="126">- ROW_COUNT</text>
    <line x1="24" y1="152" x2="536" y2="152" stroke="#b4ced8" stroke-width="2"/>
    <text class="h2" x="28" y="186">Why it matters</text>
    <text class="small" x="48" y="216">- Larger runs reduce fixed Spark overhead per row</text>
    <text class="small" x="48" y="240">- Small runs are useful for validation, not peak throughput</text>
  </g>

  <g transform="translate(620,140)">
    <rect class="border" x="0" y="0" width="560" height="250" rx="20"/>
    <rect class="blue" x="16" y="16" width="528" height="42" rx="14"/>
    <text class="h1w" x="32" y="44">2  Spark Parallelism</text>
    <text class="h2" x="28" y="92">Main settings</text>
    <text class="body" x="48" y="126">- GENERATE_PARTITIONS</text>
    <text class="body" x="48" y="154">- TARGET_PARTITIONS</text>
    <line x1="24" y1="180" x2="536" y2="180" stroke="#b4ced8" stroke-width="2"/>
    <text class="h2" x="28" y="212">Why it matters</text>
    <text class="small" x="48" y="238">- More partitions usually means more Spark task fan-out</text>
  </g>

  <g transform="translate(1210,140)">
    <rect class="border" x="0" y="0" width="560" height="250" rx="20"/>
    <rect class="green" x="16" y="16" width="528" height="42" rx="14"/>
    <text class="h1w" x="32" y="44">3  Work and Request Shaping</text>
    <text class="h2" x="28" y="92">Main settings</text>
    <text class="body" x="48" y="126">- WORK_UNIT_COUNT_TARGET</text>
    <text class="body" x="48" y="154">- CRDP_REQUEST_ITEM_TARGET</text>
    <line x1="24" y1="180" x2="536" y2="180" stroke="#b4ced8" stroke-width="2"/>
    <text class="h2" x="28" y="212">Why it matters</text>
    <text class="small" x="48" y="238">- These shape how much work Spark groups before each CRDP request</text>
  </g>

  <g transform="translate(30,420)">
    <rect class="border" x="0" y="0" width="620" height="340" rx="20"/>
    <rect class="teal" x="14" y="14" width="592" height="44" rx="14"/>
    <text class="h1w" x="30" y="43">4  The Short Mental Model</text>

    <g transform="translate(24,82)">
      <rect class="soft2" x="0" y="0" width="170" height="110" rx="16"/>
      <text class="h2" x="18" y="28" fill="#167e88">Rows</text>
      <text class="small" x="18" y="58">Start with total</text>
      <text class="small" x="18" y="82">business rows</text>

      <line x1="182" y1="55" x2="222" y2="55" stroke="#0a3661" stroke-width="8"/>
      <polygon points="222,55 207,44 207,66" fill="#0a3661"/>

      <rect class="soft2" x="236" y="0" width="170" height="110" rx="16"/>
      <text class="h2" x="254" y="28" fill="#008ab5">Work Units</text>
      <text class="small" x="254" y="58">Split rows into</text>
      <text class="small" x="254" y="82">grouped work</text>

      <line x1="418" y1="55" x2="458" y2="55" stroke="#0a3661" stroke-width="8"/>
      <polygon points="458,55 443,44 443,66" fill="#0a3661"/>

      <rect class="soft2" x="472" y="0" width="120" height="110" rx="16"/>
      <text class="h2" x="490" y="28" fill="#237e4e">CRDP</text>
      <text class="small" x="490" y="58">Chunk each</text>
      <text class="small" x="490" y="82">request</text>

      <text class="h2" x="0" y="156">Rules of thumb</text>
      <text class="body" x="0" y="190">- More partitions can improve Spark-side parallelism.</text>
      <text class="body" x="0" y="220">- More work units can improve concurrency until the cluster plateaus.</text>
      <text class="body" x="0" y="250">- Larger request targets reduce request count until another bottleneck takes over.</text>
    </g>
  </g>

  <g transform="translate(680,420)">
    <rect class="border" x="0" y="0" width="1090" height="340" rx="20"/>
    <rect class="header" x="14" y="14" width="1062" height="44" rx="14"/>
    <text class="h1w" x="30" y="43">5  How Auto Calculation Works</text>

    <g transform="translate(24,84)">
      <rect class="soft" x="0" y="0" width="1028" height="48" rx="12"/>
      <text class="small" x="18" y="30" fill="#0a3661">STEP 1</text>
      <text class="small" x="130" y="30">TARGET_PARTITIONS is auto-calculated from estimated output size and the partition floor.</text>

      <rect class="soft" x="0" y="60" width="1028" height="48" rx="12"/>
      <text class="small" x="18" y="90" fill="#0a3661">STEP 2</text>
      <text class="small" x="130" y="90">WORK_UNIT_COUNT_TARGET is auto-derived from TARGET_PARTITIONS times WORK_UNIT_COUNT_MULTIPLIER.</text>

      <text class="h2" x="0" y="156">Then the script derives</text>
      <text class="body" x="0" y="190">- WORK_UNIT_ROW_COUNT from ROW_COUNT divided by WORK_UNIT_COUNT_TARGET.</text>
      <text class="body" x="0" y="220">- CRDP_REQUEST_ITEM_TARGET by aligning to work-unit size, then capping if needed.</text>
      <text class="body" x="0" y="250">- Most users can leave the logical tuning controls at None and start with the defaults.</text>
    </g>
  </g>

  <g transform="translate(30,790)">
    <rect class="border" x="0" y="0" width="550" height="250" rx="20"/>
    <rect class="teal" x="14" y="14" width="522" height="44" rx="14"/>
    <text class="h1w" x="30" y="43">6  Small Loads</text>
    <text class="h2" x="24" y="82">Row band</text>
    <text class="small" x="28" y="112">- Up to 1,000,000 rows</text>
    <text class="h2" x="24" y="152">Typical intent</text>
    <text class="small" x="28" y="182">- Validation and short benchmark runs</text>
    <text class="small" x="28" y="206">- Keep the logical tuning controls in auto mode</text>
    <text class="tiny" x="28" y="236">Auto path: small-tier partition floor plus derived work-unit and CRDP sizing.</text>
  </g>

  <g transform="translate(625,790)">
    <rect class="border" x="0" y="0" width="550" height="250" rx="20"/>
    <rect class="blue" x="14" y="14" width="522" height="44" rx="14"/>
    <text class="h1w" x="30" y="43">7  Medium Loads</text>
    <text class="h2" x="24" y="82">Row band</text>
    <text class="small" x="28" y="112">- More than 1,000,000 and up to 10,000,000 rows</text>
    <text class="h2" x="24" y="152">Typical intent</text>
    <text class="small" x="28" y="182">- Sustained comparison and tuning runs</text>
    <text class="small" x="28" y="206">- Use the auto-derived target partitions and work units</text>
    <text class="tiny" x="28" y="236">Auto path: medium-tier partition floor plus derived work-unit and CRDP sizing.</text>
  </g>

  <g transform="translate(1220,790)">
    <rect class="border" x="0" y="0" width="550" height="250" rx="20"/>
    <rect class="green" x="14" y="14" width="522" height="44" rx="14"/>
    <text class="h1w" x="30" y="43">8  Large Loads</text>
    <text class="h2" x="24" y="82">Row band</text>
    <text class="small" x="28" y="112">- More than 10,000,000 rows</text>
    <text class="h2" x="24" y="152">Typical intent</text>
    <text class="small" x="28" y="182">- Throughput-focused and long-running jobs</text>
    <text class="small" x="28" y="206">- Let auto mode scale partitions, work units, and request sizing</text>
    <text class="tiny" x="28" y="236">Auto path: large-tier partition floor plus derived work-unit and CRDP sizing.</text>
  </g>

  <rect x="30" y="1075" width="1740" height="125" rx="16" fill="#ecf4f8" stroke="#b4ced8" stroke-width="2"/>
  <text class="h2" x="55" y="1105">What current testing suggests</text>
  <text class="body" x="55" y="1139">- The biggest gains came from moving to larger sustained loads, higher partition counts, and stronger work/request shaping.</text>
  <text class="muted" x="55" y="1169">If materially higher throughput is needed after that point, the next lever is usually more cluster capacity rather than more notebook-level tuning.</text>
</svg>




