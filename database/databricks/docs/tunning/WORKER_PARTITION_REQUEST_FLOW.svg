<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      .bg { fill: #f5f9fc; }
      .header { fill: #0a3661; }
      .teal { fill: #167e88; }
      .blue { fill: #008ab5; }
      .green { fill: #237e4e; }
      .orange { fill: #d97828; }
      .border { stroke: #b4ced8; stroke-width: 2; fill: #ffffff; }
      .soft { fill: #f8fafc; stroke: #d7e1e6; stroke-width: 2; }
      .soft2 { fill: #f9fcfe; stroke: #bfd3db; stroke-width: 2; }
      .title { font: 700 46px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 22px 'Segoe UI', Arial, sans-serif; fill: #d7e9f5; }
      .h1w { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .h2 { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0a3661; }
      .body { font: 18px 'Segoe UI', Arial, sans-serif; fill: #1a2b3a; }
      .small { font: 16px 'Segoe UI', Arial, sans-serif; fill: #1a2b3a; }
      .tiny { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1a2b3a; }
      .mono { font: 16px Consolas, 'Courier New', monospace; fill: #1a2b3a; }
      .muted { font: 16px 'Segoe UI', Arial, sans-serif; fill: #586b78; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1220"/>

  <rect class="header" x="20" y="20" width="1760" height="90" rx="16"/>
  <text class="title" x="900" y="60" text-anchor="middle">Databricks Worker, Partition, and Request Flow</text>
  <text class="subtitle" x="900" y="95" text-anchor="middle">How sample rows move from one job into Spark partitions, worker nodes, grouped work units, and CRDP request chunks</text>

  <g transform="translate(30,145)">
    <rect class="border" x="0" y="0" width="1720" height="265" rx="20"/>
    <rect class="teal" x="16" y="16" width="1688" height="44" rx="14"/>
    <text class="h1w" x="32" y="45">1  Databricks Cluster Mental Model</text>

    <g transform="translate(26,88)">
      <rect class="soft2" x="0" y="0" width="300" height="140" rx="18"/>
      <text class="h2" x="20" y="30" fill="#167e88">Driver</text>
      <text class="small" x="20" y="62">- Coordinates the Spark job</text>
      <text class="small" x="20" y="90">- Tracks stages and tasks</text>
      <text class="small" x="20" y="118">- Sends partition work to workers</text>

      <line x1="320" y1="70" x2="375" y2="70" stroke="#0a3661" stroke-width="8"/>
      <polygon points="375,70 360,59 360,81" fill="#0a3661"/>

      <rect class="soft2" x="395" y="0" width="410" height="140" rx="18"/>
      <text class="h2" x="415" y="30" fill="#008ab5">Workers</text>
      <text class="small" x="415" y="62">- Each worker is its own VM</text>
      <text class="small" x="415" y="90">- Each worker has CPU, RAM, and local disk</text>
      <text class="small" x="415" y="118">- Each worker runs multiple Spark tasks in parallel</text>

      <line x1="825" y1="70" x2="880" y2="70" stroke="#0a3661" stroke-width="8"/>
      <polygon points="880,70 865,59 865,81" fill="#0a3661"/>

      <rect class="soft2" x="900" y="0" width="760" height="140" rx="18"/>
      <text class="h2" x="920" y="30" fill="#237e4e">What Controls Throughput</text>
      <text class="small" x="920" y="62">- Node size determines per-worker compute capacity</text>
      <text class="small" x="920" y="90">- Worker count determines how much work can run at once</text>
      <text class="small" x="920" y="118">- Partition count, work units, and request size determine how well that capacity is used</text>
    </g>
  </g>

  <g transform="translate(30,435)">
    <rect class="border" x="0" y="0" width="1720" height="425" rx="20"/>
    <rect class="blue" x="16" y="16" width="1688" height="44" rx="14"/>
    <text class="h1w" x="32" y="45">2  Sample Flow: 5,000,000 Rows on a Tuned Helper Run</text>

    <text class="h2" x="28" y="95">Example control values</text>
    <rect class="soft" x="26" y="110" width="1668" height="42" rx="12"/>
    <text class="mono" x="44" y="136">ROW_COUNT = 5000000    GENERATE_PARTITIONS = 256    TARGET_PARTITIONS = 256    WORK_UNIT_COUNT_TARGET = 256 to 384    CRDP_REQUEST_ITEM_TARGET = 10000 to 20000</text>

    <g transform="translate(28,190)">
      <rect class="soft2" x="0" y="0" width="235" height="180" rx="18"/>
      <text class="h2" x="20" y="28" fill="#167e88">Source Rows</text>
      <text class="body" x="20" y="62">5,000,000 business rows</text>
      <text class="small" x="20" y="98">Think of this as one large</text>
      <text class="small" x="20" y="122">DataFrame or input file set.</text>

      <line x1="248" y1="90" x2="300" y2="90" stroke="#0a3661" stroke-width="8"/>
      <polygon points="300,90 285,79 285,101" fill="#0a3661"/>

      <rect class="soft2" x="295" y="0" width="330" height="190" rx="18"/>
      <text class="h2" x="315" y="28" fill="#008ab5">Spark Partitions</text>
      <text class="body" x="315" y="62">256 partitions</text>
      <text class="small" x="315" y="98">Spark slices the total rows into</text>
      <text class="small" x="315" y="122">scheduled work pieces based on</text>
      <text class="small" x="315" y="146">data size and cluster parallelism.</text>
      <text class="small" x="315" y="170">Too low underutilizes. Too high adds overhead.</text>

      <line x1="638" y1="90" x2="683" y2="90" stroke="#0a3661" stroke-width="8"/>
      <polygon points="683,90 668,79 668,101" fill="#0a3661"/>

      <rect class="soft2" x="698" y="0" width="270" height="190" rx="18"/>
      <text class="h2" x="718" y="28" fill="#237e4e">Workers Run Tasks</text>
      <text class="body" x="718" y="62">8 workers</text>
      <text class="small" x="718" y="98">Partitions are distributed</text>
      <text class="small" x="718" y="122">across the worker nodes.</text>
      <text class="small" x="718" y="146">Each worker can run multiple</text>
      <text class="small" x="718" y="170">tasks in parallel.</text>

      <line x1="981" y1="90" x2="1021" y2="90" stroke="#0a3661" stroke-width="8"/>
      <polygon points="1021,90 1006,79 1006,101" fill="#0a3661"/>

      <rect class="soft2" x="1036" y="0" width="325" height="190" rx="18"/>
      <text class="h2" x="1056" y="28" fill="#d97828">Grouped Work Units</text>
      <text class="body" x="1056" y="62">256 to 384 work units</text>
      <text class="small" x="1056" y="98">The job groups rows into logical</text>
      <text class="small" x="1056" y="122">work units. work_unit_row_count</text>
      <text class="small" x="1056" y="146">is auto-derived from target</text>
      <text class="small" x="1056" y="170">partitions through work_unit_count_target.</text>

      <line x1="1374" y1="90" x2="1414" y2="90" stroke="#0a3661" stroke-width="8"/>
      <polygon points="1414,90 1399,79 1399,101" fill="#0a3661"/>

      <rect class="soft2" x="1429" y="0" width="305" height="190" rx="18"/>
      <text class="h2" x="1449" y="28" fill="#237e4e">CRDP Chunks</text>
      <text class="body" x="1449" y="62">10K to 20K values</text>
      <text class="small" x="1449" y="98">How many data elements go into</text>
      <text class="small" x="1449" y="122">one protectbulk or revealbulk</text>
      <text class="small" x="1449" y="146">call. Auto-derived from work-unit sizing.</text>
    </g>
  </g>

  <g transform="translate(30,885)">
    <rect class="border" x="0" y="0" width="850" height="280" rx="20"/>
    <rect class="green" x="16" y="16" width="818" height="44" rx="14"/>
    <text class="h1w" x="32" y="45">3  The Control-to-Meaning Mapping</text>

    <g transform="translate(24,86)">
      <rect class="soft" x="0" y="0" width="802" height="42" rx="10"/>
      <text class="small" x="16" y="26" fill="#0a3661">ROW_COUNT</text>
      <text class="small" x="210" y="26">How much total business data the job must process</text>

      <rect class="soft" x="0" y="52" width="802" height="42" rx="10"/>
      <text class="small" x="16" y="78" fill="#0a3661">GENERATE_PARTITIONS / TARGET_PARTITIONS</text>
      <text class="small" x="370" y="78">How many Spark work slices are scheduled</text>

      <rect class="soft" x="0" y="104" width="802" height="42" rx="10"/>
      <text class="small" x="16" y="130" fill="#0a3661">WORK_UNIT_COUNT_TARGET</text>
      <text class="small" x="210" y="130">How many grouped helper batches the job creates</text>

      <rect class="soft" x="0" y="156" width="802" height="42" rx="10"/>
      <text class="small" x="16" y="182" fill="#0a3661">CRDP_REQUEST_ITEM_TARGET</text>
      <text class="small" x="210" y="182">How large each outbound CRDP request chunk may become</text>
    </g>
  </g>

  <g transform="translate(910,885)">
    <rect class="border" x="0" y="0" width="840" height="280" rx="20"/>
    <rect class="orange" x="16" y="16" width="808" height="44" rx="14"/>
    <text class="h1w" x="32" y="45">4  What To Remember</text>

    <text class="body" x="28" y="96">- More workers only help if enough partitions and grouped work exist to keep them busy.</text>
    <text class="body" x="28" y="132">- More partitions improve parallelism until scheduling overhead starts to dominate.</text>
    <text class="body" x="28" y="168">- More work units improve concurrency until the cluster reaches a plateau.</text>
    <text class="body" x="28" y="204">- Larger CRDP request targets reduce request count until another bottleneck takes over.</text>
    <text class="muted" x="28" y="246">This is why tuning usually progresses from load size, to partitioning, to work-unit shaping, to request sizing, and finally to cluster-size scaling.</text>
  </g>
</svg>



