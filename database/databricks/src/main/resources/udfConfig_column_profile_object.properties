# udfConfig_object_example.properties
#
# Purpose:
# - training/example config for protection profile selection
# - demonstrates the preferred structured global form:
#     column.<column>.profile
# - documents the supported order of precedence from:
#     docs/PROTECTION_PROFILE_OPTIONS.md
#
# Supported precedence:
# 1. protect.object.<object>
# 2. column.<column>.profile
# 3. COLUMN_PROFILES
# 4. default datatype-based fallback policies
#
# Optional config version fingerprint for runtime diagnostics:
#CONFIG_VERSION=2026.06.12.1
#CONFIG_RELEASE_DATE=2026-06-12
#CONFIG_CHANGE_REF=column-profile-object-example
#CONFIG_NOTES=Short one-line summary of the environment-specific config state.
#
# Recommended training message:
# - start with column.<column>.profile when the same business column should
#   resolve the same way across the environment
# - add protect.object.<object> only when a specific protected object needs to
#   override the global column default

databricksuser=admin
returnciphertextforuserwithnokeyaccess=yes

CRDPIP=yourip
CRDPPORT=8092
CRDP_SSL_ENABLED=false
CRDP_SSL_VERIFY_SERVER=false
CRDP_CA_CERT_PATH=/tmp/thales_config/crdp-ca.pem

# Java compute-cluster client-auth:
CRDP_CLIENT_PKCS12_PATH=/tmp/thales_config/crdp-client.p12
CRDP_CLIENT_PKCS12_PASSWORD=change-me

# Python wheel / SQL Warehouse client-auth:
CRDP_CLIENT_CERT_PATH=/tmp/thales_config/databricks-crdp-client-cert.pem
CRDP_CLIENT_KEY_PATH=/tmp/thales_config/databricks-crdp-client-key.pem

CRDP_CONNECT_TIMEOUT_MS=10000
CRDP_READ_TIMEOUT_MS=30000
CRDP_WRITE_TIMEOUT_MS=30000
CRDP_HTTP_MAX_IDLE_CONNECTIONS=20
CRDP_HTTP_KEEPALIVE_MINUTES=5

CRDPUSER=admin
DEFAULTREVEALUSER=admin
REVEAL_USER_OVERRIDE_ALLOWED=true

DEFAULTMETADATA=1001000
DEFAULTMODE=internal
BADDATATAG=999999999

REVEAL_CACHE_ENABLED=false
REVEAL_CACHE_MAX_SIZE=10000

APP_LOG_LEVEL=INFO
APP_LOG_FORMAT=kv
APP_LOG_INCLUDE_STACKTRACE=false
APP_LOG_COMPONENT=thales-databricks-udf

external_table_header_value=header
external_table_header_delimiter=_

# Bulk execution controls.
BATCH_SIZE=10000
CRDP_API_VERSION=v2
SPARK_GROUP_SIZE=1000
CRDP_V2_MAX_ITEMS_PER_REQUEST=1000
CRDP_V2_MAX_POLICY_GROUPS_PER_REQUEST=50
CRDP_V2_ENABLE_MULTI_POLICY=true

# Default policy fallbacks when no object-specific or column-specific profile is found.
DEFAULTINTERNALCHARPOLICY=char-internal
DEFAULTINTERNALNBRNBRPOLICY=nbr-nbr-internal
DEFAULTEXTERNALCHARPOLICY=char-external
DEFAULTEXTERNALNBRNBRPOLICY=test-nbr-nbr-external

# ---------------------------------------------------------------------------
# Option 1: Preferred structured global-column mapping
# ---------------------------------------------------------------------------
#
# Use this when the same logical column name should resolve the same profile
# across the environment.
#
column.email.profile=tag.char.internal
column.address.profile=tag.char.internal
column.ssn.profile=tag.nbr.internal
column.creditcard.profile=tag.nbr.internal
column.creditcardcode.profile=tag.nbr.internal

# Optional per-column overrides that can sit next to the profile mapping.
#column.ssn.metadata=1002000
#column.creditcard.metadata=1002000
#column.creditcardcode.metadata=1002000
# column.email.revealUser=analytics_user
# column.employee_id.policyType=internal

# ---------------------------------------------------------------------------
# Option 2: Legacy compact global fallback
# ---------------------------------------------------------------------------
#
# Leave this commented when using column.<column>.profile as the main pattern.
# Uncomment only if you intentionally want the older compact global form.
#
# COLUMN_PROFILES=email|tag.char.internal,address|tag.char.internal,ssn|tag.nbr.internal,creditcard|tag.nbr.internal,creditcardcode|tag.nbr.internal

# ---------------------------------------------------------------------------
# Option 3: Object-specific table-level overrides
# ---------------------------------------------------------------------------
#
# Use this only when a protected object must resolve differently than the global
# column defaults above.
#
# Example object names for training:
# - training_catalog.training_schema.customer_protected_internal
# - training_catalog.training_schema.customer_protected_external
# - training_catalog.training_schema.customer_protected_none
#
# Example override entries:
#
# protect.object.training_catalog.training_schema.customer_protected_internal=email|tag.char.internal,address|tag.char.internal,ssn|tag.nbr.internal,creditcard|tag.nbr.internal,creditcardcode|tag.nbr.internal
# protect.object.training_catalog.training_schema.customer_protected_external=email|tag.char.external,address|tag.char.external,ssn|tag.nbr.external,creditcard|tag.nbr.external,creditcardcode|tag.nbr.external
# protect.object.training_catalog.training_schema.customer_protected_none=email|tag.char.none,address|tag.char.none,ssn|tag.nbr.none,creditcard|tag.nbr.none,creditcardcode|tag.nbr.none
#
# Optional grouped-array serving objects for SQL Warehouse optimized reveal:
# protect.object.training_catalog.training_schema.customer_protected_internal_arrays=email|tag.char.internal,address|tag.char.internal,ssn|tag.nbr.internal,creditcard|tag.nbr.internal,creditcardcode|tag.nbr.internal
# protect.object.training_catalog.training_schema.customer_protected_external_arrays=email|tag.char.external,address|tag.char.external,ssn|tag.nbr.external,creditcard|tag.nbr.external,creditcardcode|tag.nbr.external
# protect.object.training_catalog.training_schema.customer_protected_none_arrays=email|tag.char.none,address|tag.char.none,ssn|tag.nbr.none,creditcard|tag.nbr.none,creditcardcode|tag.nbr.none
#
# Optional reveal.object examples. Leave commented unless reveal mappings differ:
# reveal.object.training_catalog.training_schema.customer_protected_internal=email|tag.char.internal,address|tag.char.internal,ssn|tag.nbr.internal,creditcard|tag.nbr.internal,creditcardcode|tag.nbr.internal
# reveal.object.training_catalog.training_schema.customer_protected_external=email|tag.char.external,address|tag.char.external,ssn|tag.nbr.external,creditcard|tag.nbr.external,creditcardcode|tag.nbr.external
# reveal.object.training_catalog.training_schema.customer_protected_none=email|tag.char.none,address|tag.char.none,ssn|tag.nbr.none,creditcard|tag.nbr.none,creditcardcode|tag.nbr.none

# ---------------------------------------------------------------------------
# Commented repository demo mappings
# ---------------------------------------------------------------------------
#
# These sample mappings are intentionally commented here to avoid confusion when
# training people on the precedence model.
#
# protect.object.my_catalog.my_schema.plaintext_protected_internal=email|tag.char.internal,address|tag.char.internal,ssn|tag.nbr.internal,creditcard|tag.nbr.internal,creditcardcode|tag.nbr.internal
# protect.object.my_catalog.my_schema.plaintext_protected_external=email|tag.char.external,address|tag.char.external,ssn|tag.nbr.external,creditcard|tag.nbr.external,creditcardcode|tag.nbr.external
# protect.object.my_catalog.my_schema.plaintext_protected_none=email|tag.char.none,address|tag.char.none,ssn|tag.nbr.none,creditcard|tag.nbr.none,creditcardcode|tag.nbr.none
# protect.object.my_catalog.my_schema.plaintext_protected_internal_arrays=email|tag.char.internal,address|tag.char.internal,ssn|tag.nbr.internal,creditcard|tag.nbr.internal,creditcardcode|tag.nbr.internal
# protect.object.my_catalog.my_schema.plaintext_protected_external_arrays=email|tag.char.external,address|tag.char.external,ssn|tag.nbr.external,creditcard|tag.nbr.external,creditcardcode|tag.nbr.external
# protect.object.my_catalog.my_schema.plaintext_protected_none_arrays=email|tag.char.none,address|tag.char.none,ssn|tag.nbr.none,creditcard|tag.nbr.none,creditcardcode|tag.nbr.none
# protect.object.my_catalog.my_schema.account_balance_numbers_protected_internal=balance|tag.nbr.internal,amount|tag.nbr.internal,fee|tag.nbr.internal
# protect.object.my_catalog.my_schema.account_balance_numbers_protected_external=balance|tag.nbr.external,amount|tag.nbr.external,fee|tag.nbr.external
# protect.object.my_catalog.my_schema.account_balance_numbers_protected_none=balance|tag.nbr.none,amount|tag.nbr.none,fee|tag.nbr.none
# protect.object.my_catalog.my_schema.account_balance_numbers_protected_internal_arrays=balance|tag.nbr.internal,amount|tag.nbr.internal,fee|tag.nbr.internal
# protect.object.my_catalog.my_schema.account_balance_numbers_protected_external_arrays=balance|tag.nbr.external,amount|tag.nbr.external,fee|tag.nbr.external
# protect.object.my_catalog.my_schema.account_balance_numbers_protected_none_arrays=balance|tag.nbr.none,amount|tag.nbr.none,fee|tag.nbr.none

# Profile aliases.
TAG.char.external=char-external
TAG.char.external.policyType=external
TAG.nbr.external=test-nbr-nbr-external
TAG.nbr.external.policyType=external
TAG.char.internal=char-internal
TAG.char.internal.policyType=internal
TAG.nbr.internal=nbr-nbr-internal
TAG.nbr.internal.policyType=internal
TAG.nbr.none=nbr-none
TAG.nbr.none.policyType=none
TAG.char.none=char-none
TAG.char.none.policyType=none

# Alternate alias examples.
# TAG.char.external=alpha-external
# TAG.char.external.policyType=external
# TAG.char.internal=plain-alpha-internal
# TAG.char.internal.policyType=internal
# TAG.nbr.external=plain-nbr-ext
# TAG.nbr.external.policyType=external
# TAG.nbr.internal=plain-nbr-internal
# TAG.nbr.internal.policyType=internal
