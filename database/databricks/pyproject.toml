[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thales-databricks-integration"
version = "0.1.0"
description = "Higher-level Databricks integration design scaffolding."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["build>=1.2.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
