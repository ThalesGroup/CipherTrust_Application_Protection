spring.application.name=thales-snow-scs-crdp-service
server.port=${PORT:8083}
app.INPUT_FORMAT=external
logging.level.com.example=DEBUG 
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.root=WARN

crdp.host=${CRDP_HOST:${CRDPIP:thales-crdp-service.stuff.svc.spcs.internal}}
crdp.port=${CRDP_PORT:${CRDPIPPORT:${CRDPPORT:8090}}}
crdp.connect-timeout-ms=${CRDP_CONNECT_TIMEOUT_MS:10000}
crdp.read-timeout-ms=${CRDP_READ_TIMEOUT_MS:30000}
crdp.write-timeout-ms=${CRDP_WRITE_TIMEOUT_MS:30000}
crdp.http-max-idle-connections=${CRDP_HTTP_MAX_IDLE_CONNECTIONS:20}
crdp.http-keepalive-minutes=${CRDP_HTTP_KEEPALIVE_MINUTES:5}
crdp.ssl.enabled=${CRDP_SSL_ENABLED:false}
crdp.ssl.verify-server=${CRDP_SSL_VERIFY_SERVER:true}
crdp.ssl.ca-cert-path=${CRDP_CA_CERT_PATH:}
crdp.ssl.trust-store-path=${CRDP_SSL_TRUST_STORE_PATH:}
crdp.ssl.trust-store-type=${CRDP_SSL_TRUST_STORE_TYPE:JKS}
crdp.ssl.trust-store-password=${CRDP_SSL_TRUST_STORE_PASSWORD:}
crdp.ssl.trust-store-password-file=${CRDP_SSL_TRUST_STORE_PASSWORD_FILE:}
crdp.ssl.client-pkcs12-path=${CRDP_CLIENT_PKCS12_PATH:}
crdp.ssl.client-pkcs12-password=${CRDP_CLIENT_PKCS12_PASSWORD:}
crdp.ssl.client-pkcs12-password-file=${CRDP_CLIENT_PKCS12_PASSWORD_FILE:}
crdp.ssl.client-pkcs12-b64=${CRDP_CLIENT_PKCS12_B64:}
crdp.ssl.client-pkcs12-b64-file=${CRDP_CLIENT_PKCS12_B64_FILE:}
